    <meta property="og:title" content="Ótica Rapido - Ótica Online &amp; Atendimento a Domicílio" />
    <meta property="og:description" content="Ótica online de alta precisão com leitor inteligente de receitas, catálogo de armações, agendamento a domicílio e emissor de orçamentos." />
    <script>
      // Guard against environments or extensions attempting to assign to window.fetch
      // when it has only a getter, which throws a fatal TypeError in strict mode.
      (function() {
        try {
          var originalFetch = window.fetch;
          var currentFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return currentFetch;
            },
            set: function(val) {
              currentFetch = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          console.warn('Could not redefine window.fetch with a setter:', e);
        }
      })();
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
